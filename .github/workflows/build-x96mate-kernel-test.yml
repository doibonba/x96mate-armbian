name: Build X96 Mate LAN Test Kernel v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout X96 custom repo
        uses: actions/checkout@v4

      - name: Checkout exact Armbian framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: cc32cd6c6dfdf36bfe89bfe2f3e881f592122fc8
          path: armbian-build
          fetch-depth: 1

      - name: Inject diagnostic H616 LAN patch
        shell: bash
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/userpatches/kernel/archive/sunxi-6.18/patches.armbian/drv-net-stmmac-dwmac-sun8i-add-h616-internal-phy.patch"

          DST="$GITHUB_WORKSPACE/armbian-build/patch/kernel/archive/sunxi-6.18/patches.armbian/drv-net-stmmac-dwmac-sun8i-add-h616-internal-phy.patch"

          echo "===== CUSTOM PATCH ====="
          sha256sum "$SRC"

          EXPECTED="816622165551ad89fd4e261b8f8ba12549e994b8d05f9d1d4167ab198a5aa466"
          ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERROR: custom patch SHA256 mismatch"
              exit 1
          fi

          echo
          echo "===== OVERWRITE ARMBIAN PATCH ====="
          cp -f "$SRC" "$DST"

          cmp "$SRC" "$DST"

          echo
          echo "===== PATCH AFTER OVERWRITE ====="
          sha256sum "$DST"

          echo
          echo "===== DIAGNOSTIC CODE ====="
          grep -n -B5 -A12 \
            'gmac->variant == &emac_variant_h616_internal' \
            "$DST"

      - name: Build diagnostic kernel
        working-directory: armbian-build
        shell: bash
        run: |
          ./compile.sh kernel \
            REVISION="26.8.3" \
            BOARD="x96-mate" \
            BRANCH="current" \
            RELEASE="noble" \
            KERNEL_CONFIGURE="no" \
            BUILD_DESKTOP="no" \
            BUILD_MINIMAL="no" \
            EXPERT="yes"

      - name: Inspect diagnostic patch result
        if: always()
        working-directory: armbian-build
        shell: bash
        run: |
          echo "===== PATCH RESULT ====="

          grep -R -a             'drv-net-stmmac-dwmac-sun8i-add-h616-internal-phy'             output/logs/ || true

          echo
          echo "===== BUILT KERNEL DEBS ====="

          find output/debs -type f             -name 'linux-image-current-sunxi64_*.deb'             -print 2>/dev/null || true

      - name: Upload kernel packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x96-mate-h616-lantest3-kernel
          path: |
            armbian-build/output/debs/linux-image-current-sunxi64_*.deb
            armbian-build/output/logs/
          if-no-files-found: error
