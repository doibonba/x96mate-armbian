name: Build X96 Mate LAN Test Kernel v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout X96 custom repo
        uses: actions/checkout@v4

      - name: Checkout exact Armbian framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: cc32cd6c6dfdf36bfe89bfe2f3e881f592122fc8
          path: armbian-build
          fetch-depth: 1

      - name: Inject diagnostic H616 LAN patch
        shell: bash
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/userpatches/kernel/archive/sunxi-6.18/patches.armbian/drv-net-stmmac-dwmac-sun8i-add-h616-internal-phy.patch"

          DST="$GITHUB_WORKSPACE/armbian-build/patch/kernel/archive/sunxi-6.18/patches.armbian/drv-net-stmmac-dwmac-sun8i-add-h616-internal-phy.patch"

          echo "===== CUSTOM PATCH ====="
          sha256sum "$SRC"

          EXPECTED="816622165551ad89fd4e261b8f8ba12549e994b8d05f9d1d4167ab198a5aa466"
          ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERROR: custom patch SHA256 mismatch"
              exit 1
          fi

          echo
          echo "===== OVERWRITE ARMBIAN PATCH ====="
          cp -f "$SRC" "$DST"

          cmp "$SRC" "$DST"

          echo
          echo "===== PATCH AFTER OVERWRITE ====="
          sha256sum "$DST"

          echo
          echo "===== DIAGNOSTIC CODE ====="
          grep -n -B5 -A12 \
            'gmac->variant == &emac_variant_h616_internal' \
            "$DST"

      - name: Build diagnostic kernel
        working-directory: armbian-build
        shell: bash
        run: |
          ./compile.sh kernel \
            REVISION="26.8.3" \
            BOARD="x96-mate" \
            BRANCH="current" \
            RELEASE="noble" \
            KERNEL_CONFIGURE="no" \
            BUILD_DESKTOP="no" \
            BUILD_MINIMAL="no" \
            EXPERT="yes"

      - name: Verify diagnostic patch was applied
        working-directory: armbian-build
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="cache/sources/linux-kernel-worktree/6.18__sunxi64__arm64/drivers/net/ethernet/stmicro/stmmac/dwmac-sun8i.c"

          echo "===== VERIFY KERNEL SOURCE ====="

          if [ ! -f "$SOURCE" ]; then
              echo "ERROR: kernel source not found:"
              echo "$SOURCE"
              exit 1
          fi

          grep -n -B5 -A12 \
            'gmac->variant == &emac_variant_h616_internal' \
            "$SOURCE" || true

          if ! grep -Pzoq \
            'if \(!gmac->use_internal_phy\) \{\s*if \(gmac->variant == &emac_variant_h616_internal\)\s*ret = sun8i_dwmac_power_internal_phy\(priv\);\s*else\s*ret = 0;\s*if \(!ret\)\s*ret = sun8i_dwmac_reset\(priv\);' \
            "$SOURCE"; then
              echo "ERROR: diagnostic code is NOT present in patched kernel source"
              exit 1
          fi

          echo
          echo "OK: diagnostic H616 external-PHY workaround IS present in kernel source"

          echo
          echo "===== BUILT DEBS ====="
          find output/debs -maxdepth 2 -type f -name '*.deb' -print 2>/dev/null || true

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: x96-mate-h616-lantest2-kernel
          path: |
            armbian-build/output/debs/linux-image-current-sunxi64_*.deb
            armbian-build/output/logs/
          if-no-files-found: error
